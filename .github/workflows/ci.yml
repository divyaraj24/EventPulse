name: CI

# Push/PR triggers are paused for now -- CircleCI covers the same
# checks in the meantime. Restore the `push`/`pull_request` block
# below to resume automatic runs here too.
on:
  workflow_dispatch:

jobs:
  sanity-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "*/__pycache__/*" -print0 \
            | xargs -0 python3 -m py_compile

      - name: Check shell script syntax
        run: |
          find . -name "*.sh" -not -path "./.venv/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: Shellcheck
        run: |
          FILES=$(find . -name "*.sh" -not -path "./.venv/*")
          if [ -n "$FILES" ]; then
            sudo apt-get install -y shellcheck
            shellcheck $FILES
          else
            echo "No shell scripts in the repo -- nothing to check."
          fi

      - name: Validate docker-compose files
        run: |
          docker compose -f docker-compose.core.yml config --quiet
          docker compose -f harness/docker-compose.yml config --quiet

      - name: Unit tests (retry policies)
        run: |
          pip install pytest
          cd worker && python3 -m pytest -v
