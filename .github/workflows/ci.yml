name: CI

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  sanity-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all Python files
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "*/__pycache__/*" -print0 \
            | xargs -0 python3 -m py_compile

      - name: Check shell script syntax
        run: |
          find . -name "*.sh" -not -path "./.venv/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Unit tests (retry policies)
        run: |
          pip install pytest
          cd worker && python3 -m pytest -v
