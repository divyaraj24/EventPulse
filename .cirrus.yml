# docker compose config validation isn't run here -- a bare container
# doesn't have the Docker engine, and Docker-in-Docker on Cirrus's free
# tier isn't worth the added complexity for one check. That check stays
# on .github/workflows/ci.yml instead; the three checks below don't need
# Docker at all.
sanity_checks_task:
  container:
    image: python:3.12-slim
    cpu: 1
    memory: 2G
  install_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends shellcheck
  py_compile_script:
    - find . -name "*.py" -not -path "./.venv/*" -not -path "*/__pycache__/*" -print0 | xargs -0 python3 -m py_compile
  shell_syntax_script:
    - find . -name "*.sh" -not -path "./.venv/*" -print0 | xargs -0 -n1 bash -n
  shellcheck_script:
    - shellcheck scripts/*.sh
  pytest_script:
    - pip install pytest
    - cd worker && python3 -m pytest -v
