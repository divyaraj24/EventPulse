version: 2.1

jobs:
  sanity-checks:
    docker:
      - image: python:3.12-slim
    steps:
      - checkout
      - run:
          name: Install shellcheck
          command: apt-get update -qq && apt-get install -y --no-install-recommends shellcheck
      - run:
          name: Byte-compile all Python files
          command: |
            find . -name "*.py" -not -path "./.venv/*" -not -path "*/__pycache__/*" -print0 \
              | xargs -0 python3 -m py_compile
      - run:
          name: Check shell script syntax
          command: |
            find . -name "*.sh" -not -path "./.venv/*" -print0 \
              | xargs -0 -n1 bash -n
      - run:
          name: Shellcheck
          command: shellcheck scripts/*.sh
      - run:
          name: Unit tests (retry policies)
          command: |
            pip install pytest
            cd worker && python3 -m pytest -v

workflows:
  build-and-test:
    jobs:
      - sanity-checks
