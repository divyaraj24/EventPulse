services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventpulse-net

  api:
    build: ./api
    container_name: eventpulse-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventpulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventpulse-net

  redis:
    image: redis:7
    container_name: eventpulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventpulse-net

  relay:
    build: ./relay
    container_name: eventpulse-relay
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventpulse
      REDIS_URL: redis://redis:6379/0
      POLL_INTERVAL_SECONDS: "0.05"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - eventpulse-net

  receiver_mock:
    build: ./receiver_mock
    container_name: eventpulse-receiver
    environment:
      SIGNING_SECRET: dev-secret-change-me
      PYTHONUNBUFFERED: "1"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventpulse-net

  worker:
    build: ./worker
    container_name: eventpulse-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventpulse
      REDIS_URL: redis://redis:6379/0
      RETRY_POLICY: ${RETRY_POLICY:-none}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      SIGNING_SECRET: dev-secret-change-me
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      receiver_mock:
        condition: service_healthy
    networks:
      - eventpulse-net

networks:
  eventpulse-net:

volumes:
  postgres_data: