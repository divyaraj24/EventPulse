services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventpulse-net

  api:
    build: ./api
    container_name: eventpulse-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventpulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eventpulse-net

networks:
  eventpulse-net:

volumes:
  postgres_data: